<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>RetailPOS – Sign In</title>
<style>
:root{
  --bg:#1f2937;--box:#ffffff;--box-text:#111827;
  --label:#374151;--muted:#6b7280;
  --input-bg:#ffffff;--input-fg:#111827;--input-bdr:#d1d5db;
  --blue:#2563eb;--blue-hover:#1d4ed8;
  --err-bg:#fee2e2;--err-fg:#991b1b;--err-bdr:#fca5a5;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0f172a;--box:#1e293b;--box-text:#f1f5f9;
  --label:#cbd5e1;--muted:#94a3b8;
  --input-bg:#0f172a;--input-fg:#f1f5f9;--input-bdr:#475569;
  --err-bg:#450a0a;--err-fg:#fca5a5;--err-bdr:#991b1b;
}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);
     display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{background:var(--box);border-radius:14px;padding:42px 46px;width:100%;
     max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.logo{font-size:2rem;text-align:center;margin-bottom:6px}
h1{font-size:1.4rem;font-weight:800;color:var(--box-text);text-align:center;margin-bottom:4px}
p{color:var(--muted);font-size:.9rem;text-align:center;margin-bottom:28px}
label{display:block;font-size:.85rem;font-weight:600;color:var(--label);margin-bottom:5px}
input[type=text],input[type=password]{
  width:100%;padding:11px 14px;border:1px solid var(--input-bdr);
  border-radius:8px;font-size:1rem;font-family:inherit;outline:none;
  background:var(--input-bg);color:var(--input-fg);
  transition:border .15s;margin-bottom:16px}
input[type=text]:focus,input[type=password]:focus{
  border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.2)}
.btn{display:block;width:100%;padding:12px;margin-top:4px;
  background:var(--blue);color:white;border:none;border-radius:8px;
  font-size:1rem;font-weight:700;cursor:pointer;transition:background .15s}
.btn:hover{background:var(--blue-hover)}
.err{background:var(--err-bg);color:var(--err-fg);border:1px solid var(--err-bdr);
  padding:10px 14px;border-radius:8px;font-size:.9rem;margin-bottom:16px}
</style>
</head>
<body>
<div class="box">
  <div class="logo">📊</div>
  <h1>RetailPOS</h1>
  <p>Owner Dashboard — sign in to continue</p>
  {% if err %}
  <div class="err">{{ err }}</div>
  {% endif %}
  <form method="post">
    <label for="username">Username</label>
    <input type="text" id="username" name="username"
           placeholder="Enter username" autofocus required/>
    <label for="pw">Password</label>
    <input type="password" id="pw" name="password"
           placeholder="Enter password" required/>
    <button type="submit" class="btn">Sign In</button>
  </form>
</div>
</body>
</html>
